<body>
    <header>
        <h1>English Podcast Learning</h1>
        <nav>
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#" onclick="toggleVocab()">📖 单词本</a></li>
                <li><a href="#" onclick="toggleDark()">深色模式</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2 id="lessonTitleDisplay">课程播放器</h2>
            <p>请选择课程并开始学习：</p>
            <p id="error-msg" style="color:red; display:none;">⚠️ 错误：找不到 data.js 数据文件</p>
        </section>

        <section id="articleBox">
            <p>正在加载内容...</p>
        </section>

        <!-- Vocab Panel -->
        <section id="vocabPanel">
            <h3>📖 单词本 <span style="font-weight:normal;font-size:0.75rem;color:#aaa;">（点击字幕中的单词即可收藏/取消）</span></h3>
            <div id="vocabList"></div>
            <div class="status-text" id="vocabCount">0 个单词</div>
        </section>

        <!-- Player + Toolbar (fixed at bottom) -->
        <section class="bottom-player-bar">
            <div class="player-controls">
                <input class="lesson-search" id="lessonSearch" type="text" placeholder="🔍 搜索课程..." oninput="filterLessons(this.value)">
                <select id="lessonSelect" onchange="changeLesson(this.value)">
                    <option value="">-- 请选择课程 --</option>
                </select>
                <span class="course-badge" id="courseBadge">共 365 课</span>
                <audio id="audioPlayer" controls></audio>
                <div class="speed-controls">
                    <button class="speed-btn" data-speed="0.5">0.5×</button>
                    <button class="speed-btn active" data-speed="1">1×</button>
                    <button class="speed-btn" data-speed="1.5">1.5×</button>
                    <button class="speed-btn" data-speed="2">2×</button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <button class="tool-btn" id="loopBtn" onclick="toggleLoop()">🔂 单句循环</button>
                <button class="tool-btn" id="cnBtn" onclick="toggleChinese()">👁 中文</button>
                <button class="tool-btn" id="abBtn" onclick="toggleAB()">📌 A-B</button>
                <span class="ab-display" id="abDisplay"></span>
                <span class="sep"></span>
                <button class="tool-btn" id="autoNextBtn" onclick="toggleAutoNext()">⏭ 自动下一课</button>
                <span class="sep"></span>
                <button class="tool-btn" onclick="toggleVocab()">📖 单词本</button>
                <button class="tool-btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ 全屏</button>
                <span class="sep"></span>
                <span style="font-size:0.75rem;color:#888;white-space:nowrap;">字号</span>
                <button class="tool-btn font-size-btn" data-size="small">小</button>
                <button class="tool-btn font-size-btn active" data-size="medium">中</button>
                <button class="tool-btn font-size-btn" data-size="large">大</button>
                <button class="tool-btn font-size-btn" data-size="xlarge">最大</button>
                <span class="kbd-hint"><kbd>Space</kbd> 暂停 · <kbd>←→</kbd> 句子 · <kbd>L</kbd>循环 · <kbd>C</kbd>中文 · <kbd>F</kbd>全屏</span>
                <span class="sep"></span>
                <span style="font-size:0.7rem;color:#aaa;white-space:nowrap;"><a href="LICENSE" target="_blank" style="color:#888;text-decoration:none;">License</a></span>
            </div>
        </section>

    </main>
    <div class="toast" id="toast"></div>
    <footer>
        <p>© 2026 English Pod Learning | <a href="https://github.com/bitter999/EnglishPod" target="_blank">GitHub</a> | <a href="LICENSE" target="_blank">License</a> | <a href="LICENSE_ZH.md" target="_blank">许可证</a></p>
    </footer>
